[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferran-agentbridge"
version = "0.1.0"
description = "Observable, persistent execution and context continuity for coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ferran Gutierrez"}]
dependencies = []

[project.optional-dependencies]
cursor = ["cursor-sdk==1.0.31"]
test = ["pytest>=8,<10"]

[project.scripts]
agentbridge = "agentbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentbridge = ["py.typed", "provider_contract_index.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
