[build-system]
requires = ["setuptools>=70.1", "wheel>=0.40"]
build-backend = "bundle_backend"
backend-path = ["tools"]

[project]
name = "ferran-agentbridge"
version = "2.3.1"
description = "Model-first Codex execution with observable local account routing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ferran Gutierrez"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
agentbridge = "agentbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentbridge = [
    "py.typed", "provider_contract_index.json", "bundle/lock.json",
    "bundle/assets/*.tar.gz", "bundle/assets/*.tar.xz",
    "bundle/grantbridge/*.mjs", "bundle/grantbridge/**/*.mjs",
    "bundle/grantbridge/LICENSE", "bundle/licenses/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
